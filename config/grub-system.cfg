set timeout=4
set default=0
set gfxmode=1024x768x32,1280x720x32,auto
set gfxpayload=keep

menuentry "MVH Desktop" {
    multiboot /boot/kernel.elf mvh.mode=desktop mvh.edition=system
    boot
}

menuentry "Install MVH Betriebsystem" {
    multiboot /boot/kernel.elf mvh.mode=setup mvh.edition=system
    boot
}

menuentry "Kernel console" {
    multiboot /boot/kernel.elf mvh.mode=shell
    boot
}
