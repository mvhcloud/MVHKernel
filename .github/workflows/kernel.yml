name: Kernel validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select update cadence
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          run=true
          cutoff=$(date -u -d '2026-08-28 00:00:00' +%s)
          now=$(date -u +%s)
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" == "17 3 * * *" && "$now" -ge "$cutoff" ]]; then run=false; fi
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" == "17 3 * * 1" && "$now" -lt "$cutoff" ]]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Check out sources
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Build kernel
        if: steps.cadence.outputs.run == 'true'
        run: make clean all

      - name: Install boot image tools
        if: steps.cadence.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y grub-pc-bin mtools qemu-system-x86 xorriso

      - name: Build bootable QEMU image
        if: steps.cadence.outputs.run == 'true'
        run: make iso system-iso

      - name: Boot QEMU compatibility matrix
        if: steps.cadence.outputs.run == 'true'
        run: |
          scripts/qemu-smoke.sh build/mvh-kernel.iso pc 128 1
          scripts/qemu-smoke.sh build/mvh-kernel.iso pc 512 2
          scripts/qemu-smoke.sh build/mvh-kernel.iso q35 1024 4
          scripts/qemu-smoke.sh build/mvh-kernel.iso q35 2048 4

      - name: Verify persistent filesystem across QEMU reboot
        if: steps.cadence.outputs.run == 'true'
        run: scripts/qemu-persistence.sh build/mvh-kernel.iso

      - name: Verify VirtIO block persistence
        if: steps.cadence.outputs.run == 'true'
        run: scripts/qemu-virtio-persistence.sh build/mvh-kernel.iso

      - name: Boot graphical distribution
        if: steps.cadence.outputs.run == 'true'
        run: scripts/qemu-gui-smoke.sh build/mvh-betriebsystem.iso

      - name: Run native tests
        if: steps.cadence.outputs.run == 'true'
        run: make host-test

      - name: Validate ELF64 image
        if: steps.cadence.outputs.run == 'true'
        run: |
          test -s build/kernel.elf
          readelf -h build/kernel.elf | grep -F "ELF64"
          readelf -h build/kernel.elf | grep -F "Advanced Micro Devices X86-64"
          nm build/kernel.elf | grep -F "__stack_chk_guard"
          nm build/kernel.elf | grep -F "__stack_chk_fail"

      - name: Upload kernel artifact
        if: steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mvh-kernel-${{ github.sha }}
          path: |
            build/kernel.elf
            build/mvh-kernel.iso
            build/mvh-betriebsystem.iso
          if-no-files-found: error
          retention-days: 14
